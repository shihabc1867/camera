<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>8K Camera</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0b0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="8K Camera">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0b0f;color:#eee;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:700px;margin:0 auto}
#view{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;object-fit:contain}
#grid{position:absolute;inset:0;pointer-events:none;display:none;
background-image:linear-gradient(to right,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%),
linear-gradient(to bottom,transparent 33.2%,rgba(255,255,255,.35) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.35) 66.6%,transparent 66.8%)}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:96px;font-weight:700;text-shadow:0 0 20px #000}
#msg{position:absolute;left:0;right:0;top:0;padding:8px 12px;background:rgba(0,0,0,.65);font-size:13px;display:none;text-align:center}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;display:flex;gap:8px}
.ib{background:rgba(0,0,0,.55);border:0;color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px}
#installBtn{display:none;background:#2563eb;border:0;color:#fff;border-radius:21px;padding:0 14px;height:42px;font-size:14px}
#panel{background:#15151c;border-top:1px solid #2a2a35}
#tabs{display:flex}
#tabs button{flex:1;padding:10px;background:none;border:0;color:#999;font-size:14px;border-bottom:2px solid transparent}
#tabs button.on{color:#fff;border-color:#4da3ff}
.tab{display:none;height:150px;overflow-y:auto;padding:8px 12px}
.tab.on{display:block}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.row label{width:84px;flex:none}
.row input[type=range]{flex:1}
.row span{width:40px;text-align:right;color:#8ab}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chip{flex:none;padding:8px 14px;border-radius:18px;background:#262633;border:1px solid #333;color:#ddd;font-size:13px}
.chip.on{background:#2563eb;border-color:#2563eb;color:#fff}
select{background:#262633;color:#fff;border:1px solid #333;border-radius:8px;padding:6px;flex:1}
#bar{display:flex;align-items:center;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
#shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#e33;box-shadow:0 0 0 3px #000 inset}
#shutter:active{transform:scale(.92)}
#shutter:disabled{opacity:.4}
#thumb{width:48px;height:48px;border-radius:10px;border:2px solid #444;background:#222 center/cover;color:#888;font-size:11px}
#reset{background:#262633;border:0;color:#fff;border-radius:10px;padding:10px 12px;font-size:13px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;z-index:10}
#modal img{flex:1;min-height:0;object-fit:contain;width:100%}
#modal .bt{display:flex;gap:10px;padding:12px;justify-content:center;flex-wrap:wrap}
#modal button,#modal a{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:15px;text-decoration:none}
#modal button.g{background:#333}
#info{text-align:center;font-size:12px;color:#aaa;padding:6px}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <video id="video" autoplay playsinline muted></video>
    <div id="grid"></div>
    <div id="count"></div>
    <div id="msg"></div>
    <div id="top">
      <button id="installBtn">Install</button>
      <button class="ib" id="gridBtn" title="Grid">▦</button>
      <button class="ib" id="flipBtn" title="Switch camera">🔄</button>
    </div>
  </div>

  <div id="panel">
    <div id="tabs">
      <button class="on" data-t="t1">Effects</button>
      <button data-t="t2">Adjust</button>
      <button data-t="t3">Settings</button>
    </div>

    <div class="tab on" id="t1"><div class="chips" id="chips"></div></div>

    <div class="tab" id="t2">
      <div class="row"><label>Brightness</label><input type="range" id="brightness" min="30" max="200" value="100"><span></span></div>
      <div class="row"><label>Contrast</label><input type="range" id="contrast" min="30" max="200" value="100"><span></span></div>
      <div class="row"><label>Saturation</label><input type="range" id="saturate" min="0" max="250" value="100"><span></span></div>
      <div class="row"><label>Hue</label><input type="range" id="hue" min="0" max="360" value="0"><span></span></div>
      <div class="row"><label>Blur</label><input type="range" id="blur" min="0" max="10" step="0.5" value="0"><span></span></div>
      <div class="row"><label>Sharpness</label><input type="range" id="sharpen" min="0" max="100" value="40"><span></span></div>
    </div>

    <div class="tab" id="t3">
      <div class="row"><label>Resolution</label>
        <select id="res">
          <option value="7680" selected>8K (7680px)</option>
          <option value="3840">4K (3840px)</option>
          <option value="0">Original (no upscale)</option>
        </select></div>
      <div class="row"><label>Quality</label>
        <select id="qual"><option value="0.95" selected>Maximum</option><option value="0.85">High</option><option value="0.7">Light (smaller file)</option></select></div>
      <div class="row"><label>Timer</label>
        <select id="timer"><option value="0">Off</option><option value="3">3 seconds</option><option value="10">10 seconds</option></select></div>
      <div class="row"><label>Format</label>
        <select id="fmt"><option value="image/jpeg" selected>JPG</option><option value="image/png">PNG (large file)</option></select></div>
    </div>

    <div id="info"></div>
    <div id="bar">
      <button id="thumb">Photo</button>
      <button id="shutter" aria-label="Take photo"></button>
      <button id="reset">Reset</button>
    </div>
  </div>
</div>

<div id="modal">
  <img id="mimg" alt="">
  <div class="bt">
    <a id="dl" download>⬇ Save</a>
    <button id="shareBtn">↗ Share</button>
    <button class="g" id="close">Close</button>
  </div>
</div>

<canvas id="cv" style="display:none"></canvas>

<script>
const $ = id => document.getElementById(id);
const video = $('video');
let stream = null, facing = 'environment', lastBlob = null, lastURL = null, busy = false;

const defaults = {brightness:100, contrast:100, saturate:100, hue:0, blur:0, sepia:0, gray:0, invert:0, sharpen:40};
const S = {...defaults};

const presets = {
  'Normal': {},
  'Vivid': {contrast:115, saturate:160},
  'B&W': {gray:100, contrast:115},
  'Sepia': {sepia:90, contrast:105},
  'Vintage': {sepia:45, contrast:90, saturate:80, brightness:105},
  'Warm': {sepia:25, saturate:130, hue:350, brightness:105},
  'Cool': {hue:190, saturate:110, brightness:102, sepia:10},
  'Dramatic': {contrast:140, saturate:120, brightness:92},
  'Fade': {contrast:80, brightness:112, saturate:80},
  'Negative': {invert:100},
  'Night': {brightness:155, contrast:115, saturate:90}
};

function filterStr(){
  return `brightness(${S.brightness}%) contrast(${S.contrast}%) saturate(${S.saturate}%) hue-rotate(${S.hue}deg) sepia(${S.sepia}%) grayscale(${S.gray}%) invert(${S.invert}%) blur(${S.blur}px)`;
}
function applyLive(){ video.style.filter = filterStr(); }

function msg(t, ms){
  const m = $('msg'); m.textContent = t; m.style.display = t ? 'block' : 'none';
  if (ms) setTimeout(() => { if (m.textContent === t) m.style.display = 'none'; }, ms);
}

// ---- Camera ----
async function startCamera(){
  try{
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode:{ideal:facing}, width:{ideal:4096}, height:{ideal:2160}},
      audio: false
    });
    video.srcObject = stream;
    video.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
    await video.play().catch(()=>{});
    video.onloadedmetadata = showInfo;
    showInfo();
    msg('');
  }catch(e){
    msg('Could not start the camera. Allow camera permission (HTTPS is required).');
    console.error(e);
  }
}
function showInfo(){
  if (video.videoWidth) $('info').textContent = `Live sensor: ${video.videoWidth}×${video.videoHeight}`;
}

// ---- UI wiring ----
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === b.dataset.t));
});

const chips = $('chips');
Object.keys(presets).forEach((name, i) => {
  const c = document.createElement('button');
  c.className = 'chip' + (i === 0 ? ' on' : '');
  c.textContent = name;
  c.onclick = () => {
    chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    const keepSharp = S.sharpen;
    Object.assign(S, defaults, presets[name], {sharpen: keepSharp});
    syncSliders(); applyLive();
  };
  chips.appendChild(c);
});

['brightness','contrast','saturate','hue','blur','sharpen'].forEach(k => {
  const el = $(k);
  el.oninput = () => { S[k] = +el.value; el.nextElementSibling.textContent = el.value; applyLive(); };
});
function syncSliders(){
  ['brightness','contrast','saturate','hue','blur','sharpen'].forEach(k => {
    $(k).value = S[k]; $(k).nextElementSibling.textContent = S[k];
  });
}
$('reset').onclick = () => {
  Object.assign(S, defaults); syncSliders(); applyLive();
  chips.querySelectorAll('.chip').forEach((x,i) => x.classList.toggle('on', i === 0));
};
$('gridBtn').onclick = () => { const g = $('grid'); g.style.display = g.style.display === 'block' ? 'none' : 'block'; };
$('flipBtn').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; startCamera(); };

// ---- Capture ----
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

$('shutter').onclick = async () => {
  if (busy) return;
  const t = +$('timer').value;
  if (t){
    const c = $('count'); c.style.display = 'flex';
    for (let i = t; i > 0; i--){ c.textContent = i; await sleep(1000); }
    c.style.display = 'none';
  }
  capture();
};

async function getSource(){
  // Try full-resolution still (ImageCapture), otherwise fall back to a video frame
  try{
    if ('ImageCapture' in window && stream){
      const ic = new ImageCapture(stream.getVideoTracks()[0]);
      const blob = await ic.takePhoto();
      const bmp = await createImageBitmap(blob);
      return {src: bmp, w: bmp.width, h: bmp.height};
    }
  }catch(e){ /* fallback */ }
  return {src: video, w: video.videoWidth, h: video.videoHeight};
}

async function capture(){
  if (!video.videoWidth){ msg('Camera is not ready yet', 2000); return; }
  busy = true; $('shutter').disabled = true;
  try{
    msg('Capturing…');
    const {src, w, h} = await getSource();
    const long = +$('res').value;
    const mime = $('fmt').value, q = +$('qual').value;
    const mirror = facing === 'user';
    const sizes = [];
    const calc = L => (w >= h) ? [L, Math.round(L * h / w)] : [Math.round(L * w / h), L];
    if (long === 0) sizes.push([w, h]);
    else { sizes.push(calc(long)); if (long > 3840) sizes.push(calc(3840)); sizes.push(calc(2560)); }

    let blob = null, used = null;
    const cv = $('cv');
    for (const [W, H] of sizes){
      try{
        msg(`Processing… ${W}×${H}`);
        await sleep(30);
        cv.width = W; cv.height = H;
        const ctx = cv.getContext('2d');
        if (!ctx) continue;
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
        ctx.save();
        if ('filter' in ctx) ctx.filter = filterStr();
        if (mirror){ ctx.translate(W, 0); ctx.scale(-1, 1); }
        ctx.drawImage(src, 0, 0, W, H);
        ctx.restore();
        if (S.sharpen > 0 && W > w) await sharpen(ctx, W, H, S.sharpen);
        msg('Creating file…');
        blob = await new Promise(r => cv.toBlob(r, mime, q));
        if (blob && blob.size > 2000){ used = [W, H]; break; }
        blob = null;
      }catch(e){ console.warn('size failed', W, H, e); blob = null; }
    }
    cv.width = cv.height = 1; // free memory
    if (!blob) throw new Error('could not create the image');

    if (lastURL) URL.revokeObjectURL(lastURL);
    lastBlob = blob; lastURL = URL.createObjectURL(blob);
    $('thumb').style.backgroundImage = `url(${lastURL})`; $('thumb').textContent = '';
    openModal(used, w, h);
    msg('');
  }catch(e){
    console.error(e); msg('Something went wrong: ' + e.message, 4000);
  }finally{
    busy = false; $('shutter').disabled = false;
  }
}

// Sharpen in strips to keep memory use low
async function sharpen(ctx, W, H, amt){
  const k = amt / 100 * 0.8, STRIP = 128;
  for (let y = 0; y < H; y += STRIP){
    const y0 = Math.max(0, y - 1), y1 = Math.min(H, y + STRIP + 1), h = y1 - y0;
    const id = ctx.getImageData(0, y0, W, h), s = id.data, out = new Uint8ClampedArray(s);
    const row = W * 4;
    for (let j = 1; j < h - 1; j++){
      for (let i = 1; i < W - 1; i++){
        const p = j * row + i * 4;
        for (let c = 0; c < 3; c++){
          out[p+c] = s[p+c] * (1 + 4*k) - k * (s[p-4+c] + s[p+4+c] + s[p-row+c] + s[p+row+c]);
        }
      }
    }
    const rs = y - y0, rc = Math.min(STRIP, H - y);
    ctx.putImageData(new ImageData(out, W, h), 0, y0, 0, rs, W, rc);
    if ((y / STRIP) % 8 === 0){ msg(`Sharpening… ${Math.round(y / H * 100)}%`); await sleep(0); }
  }
}

// ---- Result modal ----
function openModal(used, sw, sh){
  $('mimg').src = lastURL;
  const ext = $('fmt').value === 'image/png' ? 'png' : 'jpg';
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const name = `photo_${used[0]}x${used[1]}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.${ext}`;
  $('dl').href = lastURL; $('dl').download = name;
  $('shareBtn').onclick = async () => {
    try{
      const f = new File([lastBlob], name, {type: lastBlob.type});
      if (navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f]});
      else msg('Sharing is not supported here, use Save instead', 3000);
    }catch(e){}
  };
  $('modal').style.display = 'flex';
  $('info').textContent = `Last photo: ${used[0]}×${used[1]} (source ${sw}×${sh}) • ${(lastBlob.size/1048576).toFixed(1)} MB`;
}
$('close').onclick = () => { $('modal').style.display = 'none'; };
$('thumb').onclick = () => { if (lastURL) $('modal').style.display = 'flex'; };

// ---- PWA: service worker + install button ----
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; $('installBtn').style.display = 'block';
});
$('installBtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null; $('installBtn').style.display = 'none';
};
window.addEventListener('appinstalled', () => { $('installBtn').style.display = 'none'; });
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.warn));
}

syncSliders();
applyLive();
startCamera();
</script>
</body>
</html>
